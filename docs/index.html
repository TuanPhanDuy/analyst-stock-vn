<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trade Log">
  <title>Trade Log</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: #f2f2f7;
      min-height: 100vh;
      padding: env(safe-area-inset-top, 20px) 16px 40px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 16px 0 24px;
    }
    h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; color: #000; }

    .action-row { display: flex; gap: 10px; margin-bottom: 20px; }
    .action-btn {
      flex: 1; padding: 18px 0; border: none; border-radius: 14px;
      font-size: 20px; font-weight: 700; letter-spacing: 0.5px; cursor: pointer;
      transition: transform 0.1s, opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .action-btn.buy  { background: #34c759; color: #fff; }
    .action-btn.sell { background: #ff3b30; color: #fff; }
    .action-btn.dim  { opacity: 0.28; transform: scale(0.97); }

    .card { background: #fff; border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
    .row  { display: flex; align-items: center; padding: 14px 16px; border-bottom: 0.5px solid #c6c6c8; }
    .row:last-child { border-bottom: none; }
    .row label { font-size: 17px; color: #000; flex: 0 0 110px; }
    .row input {
      flex: 1; font-size: 17px; border: none; outline: none;
      text-align: right; color: #3a3a3c; background: transparent;
      font-family: inherit; min-width: 0;
    }
    .row input::placeholder { color: #c7c7cc; }

    #submitBtn {
      width: 100%; padding: 18px; background: #007aff; color: #fff;
      border: none; border-radius: 14px; font-size: 18px; font-weight: 600;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    #submitBtn:disabled { background: #aeaeb2; cursor: default; }

    .banner { display: none; margin-top: 16px; padding: 14px 16px; border-radius: 12px; font-size: 15px; line-height: 1.4; }
    .banner.ok  { background: #d4edda; color: #155724; display: block; }
    .banner.err { background: #fde8e8; color: #9b1c1c; display: block; }
  </style>
</head>
<body>

<div class="header">
  <h1>📈 Trade Log</h1>
</div>

<div class="action-row">
  <button class="action-btn buy"      id="btnBuy"  onclick="setAction('BUY')">BUY</button>
  <button class="action-btn sell dim" id="btnSell" onclick="setAction('SELL')">SELL</button>
</div>

<div class="card">
  <div class="row">
    <label>Ticker</label>
    <input id="ticker" type="text" placeholder="HCM"
           autocorrect="off" autocomplete="off" spellcheck="false"
           autocapitalize="characters"
           oninput="this.value=this.value.toUpperCase()">
  </div>
  <div class="row">
    <label>Quantity</label>
    <input id="qty" type="number" placeholder="100" inputmode="numeric" pattern="[0-9]*" min="1">
  </div>
  <div class="row">
    <label>Price (VCBS)</label>
    <input id="price" type="number" placeholder="26.5" inputmode="decimal" step="0.1" min="0.1">
  </div>
  <div class="row">
    <label>Notes</label>
    <input id="notes" type="text" placeholder="optional" autocorrect="off">
  </div>
</div>

<button id="submitBtn" onclick="submitTrade()">Submit Trade</button>
<div class="banner" id="banner"></div>

<script>
  // Injected at deploy time by deploy-pages.yml — never committed to source
  const GH_TOKEN = '__GH_DISPATCH_TOKEN__';
  const REPO     = 'TuanPhanDuy/analyst-stock-vn';
  const WORKFLOW = 'record_trade.yml';

  let action = 'BUY';

  function setAction(a) {
    action = a;
    document.getElementById('btnBuy') .classList.toggle('dim', a !== 'BUY');
    document.getElementById('btnSell').classList.toggle('dim', a !== 'SELL');
  }

  async function submitTrade() {
    const ticker = document.getElementById('ticker').value.trim().toUpperCase();
    const qty    = document.getElementById('qty').value.trim();
    const price  = document.getElementById('price').value.trim();
    const notes  = document.getElementById('notes').value.trim();
    const btn    = document.getElementById('submitBtn');
    const banner = document.getElementById('banner');

    banner.className = 'banner';

    if (!ticker)                return showErr('Ticker is required.');
    if (!qty    || +qty   <= 0) return showErr('Quantity must be greater than 0.');
    if (!price  || +price <= 0) return showErr('Price must be greater than 0.');

    btn.disabled    = true;
    btn.textContent = 'Submitting…';

    try {
      const res = await fetch(
        `https://api.github.com/repos/${REPO}/actions/workflows/${WORKFLOW}/dispatches`,
        {
          method:  'POST',
          headers: {
            'Authorization': `Bearer ${GH_TOKEN}`,
            'Accept':        'application/vnd.github.v3+json',
            'Content-Type':  'application/json',
          },
          body: JSON.stringify({
            ref: 'main',
            inputs: { action, ticker, qty, price, notes },
          }),
        }
      );

      if (res.status === 204) {
        banner.className = 'banner ok';
        banner.textContent = `✅ ${action} ${qty} ${ticker} @ ${price} submitted — check your email in ~1 min.`;
        document.getElementById('ticker').value = '';
        document.getElementById('qty').value    = '';
        document.getElementById('price').value  = '';
        document.getElementById('notes').value  = '';
      } else {
        const body = await res.json().catch(() => ({}));
        showErr(`GitHub ${res.status}: ${body.message || 'unknown error'}`);
      }
    } catch (e) {
      showErr(`Network error: ${e.message}`);
    } finally {
      btn.disabled    = false;
      btn.textContent = 'Submit Trade';
    }
  }

  function showErr(msg) {
    const b = document.getElementById('banner');
    b.className = 'banner err';
    b.textContent = '❌ ' + msg;
  }
</script>
</body>
</html>
