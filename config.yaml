thresholds:
  daily:
    min_confidence: 0.60
    rsi_oversold: 30
    rsi_overbought: 70
    volume_spike_ratio: 1.5       # volume > 1.5x 20-day avg
  monthly:
    min_confidence: 0.65
    ma_short: 20
    ma_long: 60
    volume_confirmation_ratio: 1.2
    sr_proximity_pct: 0.02
  yearly:
    min_confidence: 0.70
    pe_discount_to_sector: 0.20   # 20% below sector median P/E → bonus +0.20
    pe_cheap: 12                  # P/E below this = cheap (absolute)
    pe_expensive: 25              # P/E above this = expensive (absolute)
    pb_cheap: 1.5                 # P/B below this = below book
    pb_expensive: 4.0             # P/B above this = premium
    min_roe: 0.12
    max_debt_equity: 1.5
    min_eps_growth: 0.10
    min_dividend_yield: 0.02
    min_revenue_cagr: 0.08

regime:
  ma_short: 50
  ma_long: 200
  adx_trend_threshold: 25
  bull_signal_boost: 0.15       # +15% to BUY conviction in BULL regime
  bear_signal_penalty: 0.10     # -10% to BUY conviction in BEAR regime
  sideways_haircut: 0.10        # -10% to all signals in SIDEWAYS

foreign_flow:
  enabled: true
  lookback_days: 60
  strong_buying_threshold: 100000    # net shares > this = strong foreign buying
  cache_ttl: 3600

earnings:
  warn_days_ahead: 7            # flag tickers with events within N days
  avoid_new_positions: true

insider:
  enabled: true
  lookback_days: 90
  cache_ttl: 21600              # 6 hours

signal_adjustments:
  # Fold these previously display-only signals into the conviction score that
  # drives ranking & position sizing (see src/scoring/adjustments.py).
  use_regime: true             # multiply conviction by regime signal_multiplier
  use_foreign_flow: true       # add foreign-flow score_delta (±0.15)
  use_insider: true            # add insider score_delta (±0.20)

trade_log:
  hold_days: 5                  # forward window to resolve a signal's outcome (target/stop/expiry)

ml_signal:
  enabled: true
  min_samples: 20               # minimum closed signals before ML activates
  confidence_blend: 0.50        # weight of ML probability vs raw confidence
  # Calibration only applies once walk-forward validation shows out-of-sample
  # skill (OOS AUC ≥ 0.55 and better Brier than base rate). See src/ml_signal.validate().

sector_rotation:
  top_pct: 0.33                 # top third = rotate into
  bottom_pct: 0.33              # bottom third = rotate out of
  min_return_spread: 5.0        # minimum % spread between top/bottom for action

data_cache_ttl:
  intraday: 300          # 5 min
  daily_ohlcv: 3600      # 1 hour
  fundamentals: 86400    # 1 day
  financial_statements: 604800  # 1 week

risk_levels:
  atr_stop_multiplier: 1.5      # stop loss = price - N × ATR
  atr_target_multiplier: 3.0    # target   = price + N × ATR (2:1 R/R ratio)

backtest:
  commission_pct: 0.0015        # 0.15% round-trip (HOSE typical)
  slippage_pct: 0.001           # 0.1% market impact

output:
  top_n: 10
  formats:
    - table
    - json
