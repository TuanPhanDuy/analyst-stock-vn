name: Market Open Advisor

on:
  schedule:
    # 9:15 AM ICT = 02:15 UTC Mon–Fri (after ATO, morning session starts)
    - cron: '15 2 * * 1-5'
  workflow_dispatch:   # manual trigger for testing

jobs:
  advise:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run market open advisor
        run: python scripts/market_open_advisor.py
        env:
          GMAIL_USER:        ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL:      ${{ secrets.NOTIFY_EMAIL }}

      - name: Notify on failure
        if: failure()
        run: python scripts/notify_failure.py "Market Open Advisor"
        env:
          GMAIL_USER:        ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL:      ${{ secrets.NOTIFY_EMAIL }}
