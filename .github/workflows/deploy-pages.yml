name: Deploy Trade Web App

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Inject token into HTML
        run: |
          sed "s|__GH_DISPATCH_TOKEN__|${{ secrets.GH_DISPATCH_TOKEN }}|g" \
            docs/index.html > /tmp/index.html

      - name: Verify token was injected
        run: |
          if grep -q '__GH_DISPATCH_TOKEN__' /tmp/index.html; then
            echo "ERROR: GH_DISPATCH_TOKEN secret is empty or not set."
            echo "Go to repo Settings → Secrets and variables → Actions → New secret"
            echo "Name: GH_DISPATCH_TOKEN  Value: your ghp_... token"
            exit 1
          fi
          echo "Token injection OK"

      - name: Push to gh-pages branch
        run: |
          git config user.name "VN Trading Desk"
          git config user.email "actions@github.com"
          git fetch origin gh-pages 2>/dev/null || true
          git checkout --orphan gh-pages-tmp
          git rm -rf . --quiet
          cp /tmp/index.html index.html
          git add index.html
          git commit -m "Deploy trade web app $(date -u '+%Y-%m-%d %H:%M')"
          git push origin HEAD:gh-pages --force
